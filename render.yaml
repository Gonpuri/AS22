# Blueprint de Render: base PostgreSQL + API (Django REST Framework + FastAPI).
# El frontend se despliega aparte en Vercel (ver frontend/vercel.json).
databases:
  - name: escuela-db
    plan: free
    databaseName: escuela
    user: escuela

services:
  - type: web
    name: escuela-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: uvicorn config.asgi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escuela-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: escuela-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL del frontend en Vercel
