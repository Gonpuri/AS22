# Blueprint de Render: base PostgreSQL + API (Django REST Framework + FastAPI).
# El frontend se despliega aparte en Vercel (ver frontend/vercel.json).
databases:
  - name: escuela-db
    plan: free
    databaseName: escuela
    user: escuela

services:
  - type: web
    name: escuela-api
    runtime: python
    plan: free # si se omite, Render asigna un plan pago
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py crear_admin && python manage.py cargar_horarios_iniciales --condicionado
    startCommand: cd backend && uvicorn config.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: DATABASE_URL
        fromDatabase:
          name: escuela-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME # administrador inicial (se crea solo si no existe)
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # elegir una contraseña segura al crear el Blueprint
      - key: ANTHROPIC_API_KEY # solo para cargar horarios desde PDF escaneado (lectura con IA)
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL del frontend en Vercel, sin barra final
